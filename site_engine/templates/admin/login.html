<!doctype html>
<html lang="{{ site.language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Giriş — {{ site.site_name }}</title>
  <link rel="stylesheet" href="/static/admin.css">
  <style>:root { --primary: {{ site.branding.primary_color }}; }</style>
</head>
<body class="login-page">
  <form method="post" class="login-card">
    <div class="side-brand dark"><span>{{ site.site_name[:1] }}</span>{{ site.site_name }}</div>
    <h1>Yönetim Paneli</h1>
    {% if error %}<div class="flash err">{{ error }}</div>{% endif %}
    <input type="hidden" name="csrf" value="{{ csrf_token(request) }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Kullanıcı adı<input name="username" autocomplete="username" required autofocus></label>
    <label>Şifre<input type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn full">Giriş Yap</button>
  </form>
</body>
</html>
