name: Paketleri üret

# PyInstaller çapraz derleme yapmaz: her paket kendi işletim sisteminde üretilir.
# Linux paketi AlmaLinux 8 kabında (glibc 2.28) derlenir; böylece Ubuntu 18.04+, Debian 10+,
# Fedora 29+ ve RHEL/Rocky 8+ dağıtımlarında çalışır. Python, uv'nin taşınabilir CPython'ı
# (manylinux'un paylaşımlı kütüphanesi olmayan Python'u PyInstaller ile kullanılamıyor).

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    container: almalinux:8
    steps:
      - name: Kap hazırlığı
        run: dnf install -y -q git-core xz binutils findutils tar
      - uses: actions/checkout@v4
      - name: Python ve bağımlılıklar
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin sh
          uv python install 3.12
          uv venv --python 3.12 /tmp/venv
          VIRTUAL_ENV=/tmp/venv uv pip install --quiet -r requirements.txt pyinstaller
      - name: Derle
        run: /tmp/venv/bin/python build_exe.py
      - name: Sürüm bilgisi
        run: |
          ls -la dist/
          sha256sum dist/WebAgent-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: WebAgent-linux-x86_64
          path: dist/WebAgent-linux-x86_64
          if-no-files-found: error

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıklar
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt pyinstaller pywebview
      - name: Derle
        run: python build_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: WebAgent.exe
          path: dist/WebAgent.exe
          if-no-files-found: error

  release:
    name: Sürüme ekle
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: paketler
      - name: Dosyaları sürüme yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find paketler -type f -exec ls -la {} +
          gh release upload "${GITHUB_REF_NAME}" \
            "paketler/WebAgent.exe/WebAgent.exe" \
            "paketler/WebAgent-linux-x86_64/WebAgent-linux-x86_64" \
            --clobber --repo "${GITHUB_REPOSITORY}"
